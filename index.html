<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Tender Radar — ÉLŐ TED-adatok (pilot)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161513; --panel:#201F1C; --panel2:#2B2A26; --border:#3B3934;
    --text:#EAE8E3; --muted:#939598; --accent:#C0A062; --accent2:#D9BD84;
    --hot:#B0451F; --good:#4E9B7C; --mid:#F4B422; --low:#63615C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:3px solid var(--accent);box-shadow:0 1px 8px rgba(0,0,0,.4);position:sticky;top:0;z-index:20}
  .logo{font-weight:800;font-size:18px;letter-spacing:.5px}
  .logo span{color:var(--accent)}
  .badge{background:var(--accent);color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700}
  nav{display:flex;gap:4px;margin-left:24px}
  nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:6px;font-weight:600}
  nav a.active,nav a:hover{color:var(--text);background:var(--panel2)}
  .user{margin-left:auto;color:var(--muted);font-size:13px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:18px 24px 6px}
  .kpi{background:var(--panel);border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:10px;padding:14px 16px}
  .kpi .n{font-size:26px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi.hot .n{color:var(--hot)} .kpi.good .n{color:var(--good)} .kpi.acc .n{color:var(--accent)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 24px;align-items:center}
  input[type=search],select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
  input[type=search]{flex:1;min-width:220px}
  input:focus,select:focus{border-color:var(--accent)}
  .btn{background:var(--accent);border:none;color:#fff;font-weight:700;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px}
  .btn.sec{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  table{width:calc(100% - 48px);margin:4px 24px 40px;border-collapse:collapse}
  th{color:var(--muted);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:10px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
  td{padding:12px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  tr.row:hover{background:#26251F;cursor:pointer}
  .score{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:5px 0;border-radius:8px;font-weight:800;font-size:14px;color:#fff}
  .s-hot{background:var(--hot)} .s-good{background:var(--good)} .s-mid{background:var(--mid);color:#2B2A26} .s-low{background:var(--low)}
  .title-cell b{display:block;font-size:14px;margin-bottom:3px}
  .title-cell .sum{color:var(--muted);font-size:12.5px;line-height:1.45;max-width:520px}
  .chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.winner{margin-top:5px;font-size:12px;color:var(--good)}
  .chip{background:#263229;color:#8FCBA9;border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
  .chip.alu{background:#35301F;color:#D9BD84}
.chip.fund{border:1px solid rgba(255,255,255,.06)}
.chip.fund-eu{background:#173a2c;color:#5fd0a0}
.chip.fund-pnrr{background:#16323c;color:#5fc6d0}
.chip.fund-state{background:#1e2c46;color:#8fb4ff}
.chip.fund-local{background:#3a2c17;color:#e6b45a}
  .meta{white-space:nowrap;color:var(--muted);font-size:12.5px;line-height:1.6}
  .meta b{color:var(--text)}
  .dl-warn{color:var(--mid);font-weight:700}
  .dl-crit{color:var(--hot);font-weight:700}
  .status{border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid var(--border);background:var(--panel2);color:var(--text)}
  .st-uj{border-color:var(--accent);color:var(--accent)}
  .st-erdekes{border-color:var(--good);color:var(--good)}
  .st-nem{color:var(--low)}
  .st-ajanlat{border-color:#8FA8D9;color:#8FA8D9}
  a.src{color:var(--accent2);text-decoration:none;font-size:12.5px}
  /* detail drawer */
  #drawer{position:fixed;top:0;right:-560px;width:560px;height:100vh;background:var(--panel);border-left:1px solid var(--border);box-shadow:-4px 0 22px rgba(0,0,0,.5);z-index:30;transition:right .25s;overflow-y:auto;padding:24px}
  #drawer.open{right:0}
  #drawer h2{font-size:17px;margin-bottom:6px;line-height:1.35}
  #drawer .sec-t{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 6px}
  #drawer .box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.55}
  #drawer .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13px;line-height:1.7}
  .kv .k{color:var(--muted)}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}
  #overlay.on{display:block}
  .note{color:var(--muted);font-size:12px;padding:0 24px 20px}
  select.mini{padding:5px 8px;font-size:12px}
.odSortBtn,.kivSortBtn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 11px;font-size:12px;cursor:pointer}
.odSortBtn.on,.kivSortBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
</head>

65 mp) (1,19 mil. RON; CPV 45214100; SMIS 358136): consolidarea fundațiilor, scară exterioară de evacuare, injectarea fisurilor, recompartimentări și finisaje interioare, instalații de incendiu, termice, sanitare și electrice. Spațiile de la mansardă/pod sunt scoase din uz prin proiect; anunțul NU menționează lucrări la acoperiș/învelitoare — relevanță marginală pentru CM. JUDEȚUL HUNEDOARA. Termen 14 octombrie 2026.","auth":"Municipiul Orăștie","county":"Hunyad","city":"Orăștie","value":1193027,"deadline":"2026-10-14","prods":["HORGANYZOTT"],"cpv":"45214100","kw":{"A":[],"B":["modernizare","gradinita"],"C":["munka+épület","1-5M","EU/SMIS","hazai régió"]},"action":"Alacsony prioritás — főleg belső és gépészeti munka; legfeljebb kiegészítő bádogos elemek a nyertesnek. Ajánlattétel okt. 14-ig. Kontakt: iulia_muntean@rocketmail.com, +40 769435599.","action_ro":"Prioritate scăzută — în principal lucrări interioare și instalații; cel mult elemente de tinichigerie complementare pentru câștigător. Termen 14 oct. Contact: iulia_muntean@rocketmail.com, +40 769435599.","src":"SEAP · Kiírás (Procedura simplificata)","url":"https://e-licitatie.ro/pub/notices/simplified-notice/v2/view/100245092","pub":"2026-09-24"},{"status":"ÚJ","owner":"—","contact":{"email":"szt.miklospleb@gmail.com","phone":"+40 724235263"},"fund":"eu","winner":null,"id":"SCN1180094","score":60,"rule":48,"delta":12,"title":"Restaurare, consolidare și punere în valoare — monumentul istoric „Biserica Romano-Catolică Sfântu Nicolae” din Odorheiu Secuiesc și amenajare teren (PR Centru 2021–2027)","sum":"A székelyudvarhelyi Szent Miklós római katolikus plébániatemplom (1787–1793, A kategóriás, országos jelentőségű műemlék, LMI HR-II-m-A-12898.01) restaurálása, szerkezeti megerősítése és környezetrendezése, a Központi Régió Regionális Programja 2021–2027 (8. prioritás, 8.1 felhívás) forrásából (20,37 M RON; CPV 45212314). A hirdetmény kifejezetten tartalmazza a TETŐSZERKEZET (șarpantă) ÉS A TETŐHÉJAZAT (învelitoare) felújítását/megerősítését a hagyományos technikák és a tömegforma megtartásával, a HOMLOKZATOK restaurálását, a nedvesség elleni védelmet (drenázs) és villámvédelmet is. A héjazat anyagát a hirdetmény nem nevezi meg. Hargita megye. Határidő 2026. október 9.","sum_ro":"Restaurarea, consolidarea și punerea în valoare a Bisericii Romano-Catolice „Sfântu Nicolae” din Odorheiu Secuiesc (1787–1793, monument istoric grupa A, cod LMI HR-II-m-A-12898.01) și amenajarea terenului, cu finanțare prin Programul Regional Centru 2021–2027 (Prioritatea 8, apelul 8.1) (20,37 mil. RON; CPV 45212314). Anunțul prevede explicit refacerea/consolidarea ȘARPANTEI ȘI A ÎNVELITORII, cu respectarea volumetriei și a tehnicilor tradiționale, RESTAURAREA FAȚADELOR, controlul umidității (drenaj) și instalarea paratrăsnetului. Materialul învelitorii nu este precizat în anunț. Jud. Harghita. Termen 9 octombrie 2026.","auth":"Parohia Romano-Catolică Odorheiu Secuiesc","county":"Hargita","city":"Odorheiu Secuiesc","value":20370205,"deadline":"2026-10-09","prods":["TETOFEDES","CSATORNA","HOMLOKZAT","REZ"],"cpv":"45212314","kw":{"A":[],"B":["invelitoare","sarpanta","restaurare fatade","monument istoric","paratrasnet"],"C":["CPV-B","munka+épület",">20M","EU/SMIS"]},"action":"Nagy értékű műemlék-templom, kimondott tetőszerkezet- és héjazat-felújítással — a műemléki kivitelezőknek (restaurátor-engedéllyel) héjazat + bádogos csomag (ereszcsatorna, lefolyó, párkány- és toronylemezek), a terv szerinti anyagból (réz / titán-cink / horganyzott lemez — a kiírási dokumentációban ellenőrizendő). Ajánlattétel okt. 9-ig. Kontakt: József Márton, szt.miklospleb@gmail.com, +40 724235263.","action_ro":"Monument de valoare mare, cu refacerea explicită a șarpantei și a învelitorii — pentru constructorii specializați în monumente: pachet învelitoare + tinichigerie (jgheaburi, burlane, tablă de cornișă și de turn) din materialul prevăzut în proiect (cupru / titan-zinc / tablă zincată — de verificat în documentația de atr ul echipamentelor tehnologice și a dotărilor (6,90 mil. RON; CPV 45000000), conform Proiectului Tehnic nr. 77/august 2025. Trei clădiri școlare noi pe același amplasament: învelitoarea, sistemul pluvial complet (jgheaburi, burlane), tabla de atic și de cornișă, plus elementele de tinichigerie de fațadă pot fi ofertate împreună, într-un singur pachet. Jud. Argeș. Termen 8 octombrie 2026. Finanțare proprie (buget local) — anunțul nu indică fonduri UE.","auth":"Municipiul Pitești","county":"Argeș","city":"Pitești","value":6899025,"deadline":"2026-10-08","prods":["TETOFEDES","CSATORNA","HOMLOKZAT","HORGANYZOTT","TRAPEZLEMEZ"],"cpv":"45000000","kw":{"A":[],"B":["construire corp","desfiintare","scoala gimnaziala","dotari"],"C":["munka+épület",">5M"]},"action":"Tiszta új építés (3 iskolai korpusz) — a nyertes kivitelezőnek héjazat + csapadékvíz + attika/párkány rendszerajánlat egy kézből. Pitești-ben egyszerre három iskolaprogram fut (Negru Vodă CN1096502, Mircea Eliade 653076-2026, Simonide SCN1180063): a helyi kivitelezői kört érdemes egyszerre megkeresni. Ajánlattétel okt. 8-ig. Kontakt: primaria@primariapitesti.ro, +40 728851830.","action_ro":"Construcție nouă curată (3 corpuri școlare) — pentru executantul câștigător: ofertă de sistem învelitoare + pluvial + atic/cornișă dintr-o singură sursă. La Pitești rulează simultan trei programe școlare (Negru Vodă CN1096502, Mircea Eliade 653076-2026, Simonide SCN1180063): merită abordat cercul local de constructori o singură dată, pentru toate. Termen 8 oct. Contact: primaria@primariapitesti.ro, +40 728851830.","src":"SEAP · Kiírás (Procedura simplificata)","url":"https://e-licitatie.ro/pub/notices/simplified-notice/v2/view/100244976","pub":"2026-09-21"},{"status":"ÚJ","owner":"—","contact":{"email":"primariabroscauti@hotmail.com","phone":"0231621621"},"fund":"eu","winner":null,"id":"SCN1180057","score":40,"rule":30,"delta":10,"title":"Execuție lucrări — „Reabilitare și modernizare corp școlar «Școala nr. 1», comuna Broscăuți, ES"],"cpv":"45212314","kw":{"A":["fațadă"],"B":["restaurare fatada","modernizare","colegiu","monument istoric"],"C":["CPV-B","munka+épület","1-5M","hazai régió"]},"action":"HAZAI PÁLYA (Hunyad) + kimondott homlokzat-restaurálás — ez a hét legjobb bádogos belépője. Műemlék-homlokzathoz párkány-, attika- és könyöklőlemez (glafuri) + komplett ereszcsatorna-rendszer csomagajánlat, szükség esetén rézből vagy titán-cinkből. Ajánlattétel okt. 9-ig; érdemes a szászvárosi/dévai kivitelezői kört közvetlenül megkeresni. Kontakt: Iulia Muntean, iulia_muntean@rocketmail.com, +40 769435599.","action_ro":"TEREN PROPRIU (Hunedoara) + restaurare de fațadă explicită — cel mai bun punct de intrare pentru tinichigerie din această săptămână. Pentru o fațadă de monument: ofertă pachet tablă de cornișă, de atic și glafuri + sistem pluvial complet, la nevoie din cupru sau titan-zinc. Termen 9 oct.; merită abordat direct cercul de constructori din Orăștie/Deva. Contact: Iulia Muntean, iulia_muntean@rocketmail.com, +40 769435599.","src":"SEAP · Kiírás (Procedura simplificata)","url":"https://e-licitatie.ro/pub/notices/simplified-notice/v2/view/100244897","pub":"2026-09-18"},{"status":"ÚJ","owner":"—","contact":{"email":"monika.borsos@sepsi.ro","phone":"+40 267316957"},"fund":null,"winner":null,"id":"SCN1180011","score":58,"rule":44,"delta":14,"title":"Execuția lucrărilor — „Design Bank – Reabilitare și refuncționalizare unitate administrativă ca centru de inovație” (fosta clădire BNR), Sfântu Gheorghe","sum":"A sepsiszentgyörgyi egykori BNR-székház (Kossuth Lajos u. 10.) teljes felújítása és innovációs központtá alakítása (10,91 M RON; CPV 45453000), 18 hónapos kivitelezéssel és MINIMUM 5 ÉV (60 hónap) kivitelezői garanciával. Reprezentatív, városközponti banképület: a tetőhéjazat, az attika- és párkánylemezek, a glafuri és a teljes ereszcsatorna-rendszer cseréje ilyen léptékű refunkcionalizálásnál szinte biztosan tétel. KOVÁSZNA MEGYE, Sepsiszentgyörgy — CM legszűkebb hazai pályája, gyakorlatilag helyi szállítás. Határidő 2026. október 14.","sum_ro":"Reabilitarea și refuncționalizarea integrală a fostei clădiri BNR din str. Kossuth Lajos nr. 10, Municipiul Sfântu Gheorghe, ca centru de inovație (10,91 mil. RON; CPV 45453000), cu termen de execuție 18 luni și garanție de minimum 5 ani (60 de luni). Clădire bancară reprezentativă din centrul orașului: la o refuncționalizare de această amploare, învelitoarea, tabla de atic și de cornișă, glafurile și sistemul pluvial complet sunt aproape sigur capitole distincte. JUDEȚUL COVASNA, Sfântu Gheorghe — cel mai apropiat teren propriu CM, practic livrare locală. Termen 14 octombrie 2026.","auth":"Municipiul Sfantu Gheorghe","county":"Kovászna","city":"Sfântu Gheorghe","value":10906469,"deadline":"2026-10-14","prods":["TETOFEDES","HOMLOKZAT","CSATORNA","REZ","HORGANYZOTT"],"cpv":"45453000","kw":{"A":[],"B":["reabilitare","refunctionalizare","cladire administrativa"],"C":["CPV-A","munka+épület",">5M","hazai régió"]},"action":"HELYI TÉTEL (Sepsiszentgyörgy) — a legrövidebb szállítási távolság az egész listán. A 60 hónapos garancia miatt a kivitelező prémium anyagot fog keresni: titán-cink vagy réz tetőfedés és ereszcsatorna, valamint attika-/párkánylemez ajánlat. Az önkormányzat beszerzési felelősével (Borsos Mónika) és a helyi kivitelezői körrel is érdemes okt. 14. előtt egyeztetni. Kontakt: monika.borsos@sepsi.ro, +40 267316957.","action_ro":"LUCRARE LOCALĂ (Sfântu Gheorghe) — cea mai scurtă distanță de livrare din toată lista. Din cauza garanției de 60 de luni, executantul va căuta materiale premium: ofertă de învelitoare și sistem pluvial din titan-zinc sau cupru, plus tablă de atic/cornișă. Merită discutat înainte de 14 oct. atât cu responsabilul de achiziții al primăriei (Borsos Mónika), cât și cu cercul local de constructori. Contact: monika.borsos@sepsi.ro, +40 267316957.","src":"SEAP · Kiírás (Procedura simplificata)","url":"https://e-licitatie.ro/pub/notices/simplified-notice/v2/view/100244924","pub":"2026-09-18"},{"status":"ÚJ","owner":"—","contact":{"email":"alina.vasile@primarias1.ro","phone":"+40 213191013"},"fund":null,"winner":null,"id":"CN1096536","score":58,"rule":42,"delta":16,"title":"Servicii de proiectare, asistență tehnică și lucrări de execuție — „CONSTRUIREA COMPLEXULUI EDUCAȚIONAL MULTIFUNCȚIONAL ÎN CARTIERUL HENRI COANDĂ”, Sector 1 București","sum":"ÚJ, többfunkciós oktatási komplexum tervezése és kivitelezése a bukaresti 1. kerület Henri Coandă negyedében: „A\" korpusz általános iskola (Sc 1.770 m², bruttó 5.825 m², D+P+3E), „B\" korpusz óvoda (Sc 1.400 m², 4.085 m²) és további épületrészek. Becsült érték 157,44 M RON — ez az idei lista legnagyobb új építési tétele. Ekkora, teljesen új épületegyüttesnél a lapostető-/magastető-héjazat, a teljes csapadékvíz-elvezetés, az attika- és párkánylemezek, valamint a homlokzati fém burkolat (ACP, alumínium kazetta, trapézlemez) önállóan is több millió lejes tételek. Határidő 2026. október 26. A SEAP-pár a lekérdezés időpontjáig nem volt azonosítható. A TED 649825-2026 közlés SEAP-párja időközben megjelent (CN1096536, 2026-09-21, ajánlati határidő változatlanul okt. 26.); a rekord a SEAP-hirdetményre lett átvezetve. A SEAP-leírás szerint a komplexumhoz „C\" korpusz is tartozik: TORNATEREM + USZODA (Sc 1.265 m², Sd 4.435 m², S+D+P+M+1E); a szerződés min. 80 hónap (tervezés max. 8, kivitelezés max. 36 hónap, garancia min. 36 hónap). Kontakt: alina.vasile@primarias1.ro, +40 213191013.","sum_ro":"Proiectarea, asistența tehnică și construirea unui complex educațional multifuncțional NOU în cartierul Henri Coandă, Sectorul 1 București: corpul A – școală gimnazială (Sc = 1.770 mp, Sd supraterană = 5.825 mp, regim D+P+3E), corpul B – grădiniță (Sc = 1.400 mp, Sd = 4.085 mp) și corpuri suplimentare. Valoare estimată 157,44 mil. RON — cea mai mare lucrare nouă de construcții din lista curentă. La un ansamblu complet nou de această mărime, învelitoarea (terasă și/sau șarpantă), sistemul pluvial complet, tabla de atic și de cornișă, precum și placarea metalică a fațadei (ACP, casete de aluminiu, tablă cutată) reprezintă fiecare capitole de ordinul milioanelor de lei. Termen 26 octombrie 2026. Perechea SEAP nu a putut fi identificată la momentul interogării. Perechea SEAP a anunțului TED 649825-2026 a apărut între timp (CN1096536, 21.09.2026, termen neschimbat 26 oct.); înregistrarea a fost mutată pe anunțul SEAP. Conform descrierii SEAP, complexul include și corpul C: SALĂ DE SPORT + BAZIN DE ÎNOT (Sc 1.265 mp, Sd 4.435 mp, S+D+P+M+1E); durata contractului min. 80 de luni (proiectare max. 8, execuție max. 36 de luni, garanție min. 36 de luni). Contact: alina.vasile@primarias1.ro, +40 213191013.","auth":"Sectorul 1 al Municipiului București","county":"Bukarest","city":"București","value":157438025,"deadline":"2026-10-26","prods":["TETOFEDES","HOMLOKZAT","CSATORNA","ACP","ALU_LEMEZ","TRAPEZLEMEZ","SZERKEZET"],"cpv":"45214200","kw":{"A":[],"B":["construire complex educational","scoala gimnaziala","gradinita","proiectare si executie"],"C":["CPV-B","munka+épület",">50M"]},"action":"A hét legnagyobb volumenű tétele — tervezés+kivitelezés csomag, tehát a nyertes generálkivitelező korán dönt az anyagokról. Érdemes már az ajánlati szakaszban megkeresni a nagy bukaresti generálkivitelezőket rendszerajánlattal: tetőfedés + csapadékvíz + attika/párkány + homlokzati fém burkolat egy kézből. Ajánlattétel okt. 26-ig. Kontakt: Alina Vasile, alina.vasile@primarias1.ro.","action_ro":"Cea mai mare lucrare ca volum din această săptămână — pachet proiectare+execuție, deci antreprenorul general câștigător decide devreme asupra materialelor. Merită contactați marii antreprenori generali din București încă din faza de ofertare, cu o ofertă de sistem: învelitoare + pluvial + atic/cornișă + placare metalică de fațadă dintr-o singură sursă. Termen 26 oct. Contact: Alina Vasile, alina.vasile@primarias1.ro.","src":"SEAP · Kiírás (Licitatie deschisa)","url":"https://e-licitatie.ro/pub/notices/c-notice/v2/view/1 n — itt az alumínium és a bevonatolt acél ereszcsatorna/héjazat műszaki érv is, nemcsak ár. A nyertes generálkivitelezőt korán érdemes elérni: teljes tető- és csapadékvíz-rendszer csomag, korrózióállósági dokumentációval. Ajánlattétel okt. 7-ig. Kontakt: achizitii@sbtghiol.ro, 0737327235.","action_ro":"Patru clădiri noi într-un singur contract, în mediu marin — aici aluminiul și oțelul prevopsit pentru pluvial/învelitoare sunt un argument tehnic, nu doar de preț. Antreprenorul general câștigător merită abordat devreme: pachet complet de acoperiș și sistem pluvial, cu documentație de rezistență la coroziune. Termen 7 oct. Contact: achizitii@sbtghiol.ro, 0737327235.","src":"SEAP · Kiírás (Procedura simplificata)","url":"https://e-licitatie.ro/pub/notices/simplified-notice/v2/view/100244860","pub":"2026-09-17"},{"status":"ÚJ","owner":"—","contact":{"email":"achizitii1.plm@gmail.com","phone":"+40 254560504"},"fund":"eu","winner":null,"id":"CN1096518","score":44,"rule":32,"delta":12,"title":"Execuție lucrări — „Eficientizare energetică clădiri rezidențiale în Municipiul Lupeni, Bloc 50, Bulevardul Păcii” (Cod SMIS 348252)","sum":"Egy többlakásos lakótömb (Bloc 50, Bulevardul Păcii) energetikai felújítása Lupenyben (2,06 M RON; CPV 45453000). Finanszírozás: Programul Regional Vest 2021–2027, P3/RSO2.1, PRV/3.1.A/1.6 „Energiahatékonyság lakóépületekben – Zsil-völgyi ITI\", 547/26.06.2026 sz. finanszírozási szerződés. Tömbfelújításnál az ablakkönyöklő-lemez (glafuri), az attikalemez és a teljes ereszcsatorna-/lefolyó-rendszer cseréje szabványos tétel. HUNYAD MEGYE — CM hazai pályája; Lupenyben jelenleg 4-5 párhuzamos tömbprogram fut (Bloc F3, Bloc 16, Bloc A6, Bloc 55). Határidő 2026. október 26.","sum_ro":"Eficientizarea energetică a unui imobil rezidențial multifamilial (Bloc 50, Bulevardul Păcii) din Municipiul Lupeni (2,06 mil. RON; CPV 45453000). Finanțare nerambursabilă prin Programul Regional Vest 2021–2027, Prioritatea 3 / RSO2.1, apelul PRV/3.1.A/1.6 „Eficiență ene function view(){

     <td class="meta"><b>${t.deadline||'—'}</b><br><span class="${dlc}">${dl===null?'':(dl<0?tr('lejart'):dl+' '+tr('nap'))}</span></td>

     <td class="meta">${srcDisp(t.src)}<br><a class="src" href="${t.url}" target="_blank" onclick="event.stopPropagation()">${tr('orig')}</a></td></tr>`;}).join('');

function filterOda(qv){
  var hu=L==='hu';
  var nm=function(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');};
  var f=nm(qv);
  var rows=OD.filter(function(o){return !f||nm(o.w+' '+o.c+' '+cjudRO(o.c)+' '+o.p+' '+(L==='ro'?(PTYPE_RO[o.p]||''):'')+' '+o.t+' '+(odProjRegion(o)||'')).includes(f);});
  if(odRegFilter) rows=rows.filter(function(o){return odProjRegion(o)===odRegFilter;});
  if(odSort==='score') rows=rows.slice().sort(function(a,b){return odScore(b)-odScore(a);});
  else if(odSort==='value') rows=rows.slice().sort(function(a,b){return (b.v||0)-(a.v||0);});
  else rows=rows.slice().sort(function(a,b){return (b.d||'').localeCompare(a.d||'');});
  document.getElementById('odaBody').innerHTML = rows.map(function(o){
    var val=o.v?o.v+' M':'—';
    var _pr=odProjRegion(o), _hq=odHqRegion(o);
    var regCell = _pr ? (_pr + ((_hq&&_hq!==_pr) ? ' <span style="color:var(--muted);font-size:10px" title="'+(hu?'a nyertes kivitelező székhely-régiója (más, mint a projekté)':'regiunea sediului constructorului (diferită de a proiectului)')+'">· '+(hu?'kiv.':'constr.')+': '+_hq+'</span>' : '')) : '<span style="color:var(--muted)">—</span>';
    return '<tr><td><span class="score '+sc(odScore(o))+'" style="min-width:34px;padding:3px 0;font-size:12px">'+odScore(o)+'</span></td>'
      +'<td style="white-space:nowrap;color:var(--muted)">'+o.d+'</td>'
      +'<td style="white-space:nowrap;color:var(--muted)">'+val+'</td>'
      +'<td style="white-space:nowrap">'+regCell+'</td>'
      +'<td>'+cjudDisp(o.c)+'</td>'
      +'<td>'+ptypeDisp(o.p)+'</td>'
      +'<td>'+winnersHtml(o.w)+'</td>'
      +'<td>'+o.t+'</td>'
      +'<td><a class="src" href="'+o.u+'" target="_blank">'+tr('orig')+'</a></td></tr>';
  }).join('');
}

    return '<tr><td style="color:var(--muted)">'+(pos+1)+'</td><td><b>'+k.name+'</b></td><td style="white-space:nowrap">'+regCell+'</td><td><b>'+k.wins+'</b><span style="color:var(--muted)"> / '+k.solo+'</span></td><td style="text-align:center">'+s.n+'</td><td style="white-space:nowrap">'+avgmax+'</td><td style="color:var(--muted);white-space:nowrap">'+val+'</td><td>'+cjudStr(k.county)+'</td><td>'+contact+'</td><td>'+projCell+'</td></tr>'+expand;
  }).join('');
}

function bar(label,val,max,color){
  const w=max?Math.round(val/max*100):0;
  return `<div style="display:grid;grid-template-columns:190px 1fr 90px;gap:10px;align-items:center;margin:5px 0;font-size:13px">
    <span style="color:var(--muted)">${label}</span>
    <div style="background:var(--panel2);border-radius:6px;height:18px"><div style="width:${w}%;height:18px;border-radius:6px;background:${color}"></div></div>
    <b>${typeof val==='number'&&val>1e5?new Intl.NumberFormat('hu-HU').format(Math.round(val/1e6))+'M RON':val}</b></div>`;
}
function renderStats(){
  const bands=[['90–100 (HOT)',t=>t.score>=90,'var(--hot)'],['65–89',t=>t.score>=65&&t.score<90,'var(--good)'],['50–64',t=>t.score>=50&&t.score<65,'var(--mid)'],['35–49',t=>t.score>=35&&t.score<50,'var(--low)'],['0–34',t=>t.score<35,'#3a4653']];
  const bmax=Math.max(...bands.map(b=>T.filter(b[1]).length));
  const byC={}; T.forEach(t=>{byC[t.county]=byC[t.county]||{n:0,v:0}; byC[t.county].n++; byC[t.county].v+=(t.value||0);});
  const cRows=Object.entries(byC).sort((a,b)=>b[1].v-a[1].v);
  const cmax=Math.max(...cRows.map(x=>x[1].v));
  const byP={}; T.forEach(t=>(t.prods||[]).forEach(p=>byP[p]=(byP[p]||0)+1));
  const pRows=Object.entries(byP).sort((a,b)=>b[1]-a[1]); const pmax=Math.max(...pRows.map(x=>x[1]),1);
  const totV=T.reduce((a,t)=>a+(t.value||0),0);
  statsPanel.innerHTML = `
   <h2 style="font-size:16px;margin-bottom:14px">${tr('statH')} (${T.length} ${tr('statT')} ${new Intl.NumberFormat('hu-HU').format(Math.round(totV/1e6))}M RON)</h2>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px">
    <div><div class="sec" style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">${tr('statB')}</div>
      ${bands.map(b=>bar(b[0],T.filter(b[1]).length,bmax,b[2])).join('')}
      <div class="sec" style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:18px 0 8px">${tr('statP')}</div>
      ${pRows.map(p=>bar(prodDisp(p[0]),p[1],pmax,'var(--accent)')).join('')}</div>
    <div><div class="sec" style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">${tr('statC')}</div>
      ${cRows.map(c=>bar((c[0]?cjudDisp(c[0]):(L==='ro'?'Județ nespecificat':'Megye nélkül'))+' ('+c[1].n+' '+(L==='ro'?'buc.':'db')+')',c[1].v,cmax,'var(--accent2)')).join('')}
      </div>
   </div>
   <div class="note" style="padding:16px 0 0">${L==='ro'?'În sistemul live: tendințe săptămânale, statistici de colectare pe surse, pâlnie de conversie (interesant → contactat → ofertă → câștigat), activitate de vânzări.':'Éles rendszerben itt: heti trendek, forrásonkénti gyűjtési statisztika, konverziós tölcsér (érdekes → megkeresve → ajánlat → nyert), sales-aktivitás.'}</div>`;
}

   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    ${Object.entries(KWPKG).map(([k,v])=>`
     <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px">
      <b style="font-size:13px">${(L==='ro'?({"A — direkt anyag":"A — material direct","B — tető/homlokzat/bádogos":"B — acoperiș/fațadă/tinichigerie","C — közvetett (épület+munka)":"C — indirect (clădire+lucrare)","N — negatív":"N — negativ"})[k]:k)||k}</b>
